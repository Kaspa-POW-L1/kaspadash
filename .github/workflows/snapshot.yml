name: snapshot

on:
  schedule:
    # Hourly, at :17 past the hour (offset to dodge top-of-hour congestion).
    - cron: "17 * * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab to seed data now

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Take snapshot
        run: node scripts/snapshot.mjs

      - name: Commit if changed
        run: |
          git config user.name  "kaspa-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: snapshot $(date -u +%FT%TZ) [skip ci]"
            git push
          fi
