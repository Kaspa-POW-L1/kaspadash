name: snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Take snapshot
        run: node scripts/snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "kaspa-snapshot-bot"
          git config user.email "action@github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: snapshot [skip ci]"
            git push
          fi
